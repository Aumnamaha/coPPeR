<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>coPPeR Workspace</title>
<link rel="stylesheet" href="/workspace/styles.css">
<script src="/workspace/app.js"></script>
</head>
<body>
<div id="app" class="split-layout">

  <!-- ===== LEFT AI ASSISTANT RAIL (360px) ===== -->
  <aside id="left-rail" class="rail rail-left">
    <div class="rail-header">
      <h1 class="brand-title">Ask coPPeR</h1>
      <div class="rail-actions">
        <button id="btn-new-session" class="pill-btn" title="New Session">+ New Session</button>
        <button id="btn-apply-to-app" class="pill-btn" title="Apply to Active App">Apply to Active App</button>
      </div>
    </div>

    <!-- Chat Stream -->
    <div id="chat-stream" class="chat-stream"></div>

    <!-- Prompt Composer Card -->
    <div class="composer-card">
      <!-- Context Chip Area -->
      <div id="context-chip-area" class="chip-area hidden"></div>
      <textarea id="prompt-input" placeholder="Ask about this document or describe an edit..." rows="2"></textarea>
      <div class="composer-toolbar">

        <!-- + File Picker Button -->
        <button id="btn-file-picker" class="toolbar-btn" title="Open Document File">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>

        <!-- Dashed-Square Selection Tool Button -->
        <button id="btn-selection-tool" class="toolbar-btn" title="Capture selection from active window or screen">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Dashed square border -->
            <rect x="3" y="3" width="18" height="18" rx="2" stroke="#64748B" stroke-width="2" stroke-dasharray="5 3"/>
            <!-- Cursor pointer inside the dashed box -->
            <path d="M9 7 L9 17 L12.5 13.5 L16 19 L18 18 L14.5 12.5 L19 12.5 Z" fill="#2563EB"/>
          </svg>
        </button>

        <!-- Model Selector Pill -->
        <div id="model-selector" class="model-pill">
          <span id="model-label">&#x2726; coPPeR-1B &middot; Local</span>
          <svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 4.5L6 7.5L9 4.5" stroke="#64748B" stroke-width="1.5" fill="none"/></svg>
          <div id="model-dropdown" class="dropdown hidden">
            <div class="dropdown-item active" data-model="copper-1b-local">&#x2726; coPPeR-1B &middot; Local</div>
            <div class="dropdown-item" data-model="qwen-35b-lan">Qwen-35B &middot; LAN</div>
            <div class="dropdown-item" data-model="gguf-llamacpp">GGUF &middot; Llama.cpp</div>
          </div>
        </div>

        <!-- Send Button -->
        <button id="btn-send" class="send-btn" title="Send (Enter)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M5 19L12 3L19 19L12 15L5 19Z" fill="#FFFFFF"/>
          </svg>
        </button>

      </div>
    </div>
  </aside>

  <!-- ===== RIGHT DOCUMENT & DIFF CANVAS (flex: 1) ===== -->
  <main id="right-canvas" class="canvas">
    <!-- Top Document Bar -->
    <div class="doc-bar">
      <span id="doc-title" class="doc-title">Untitled</span>
      <div class="mode-tabs">
        <button class="tab-btn active" data-mode="document">Document</button>
        <button class="tab-btn" data-mode="split-diff">Split Diff</button>
        <button class="tab-btn" data-mode="table">Structured Table / Checklist</button>
      </div>
      <div class="doc-actions hidden" id="diff-actions">
        <button id="btn-keep-edit" class="action-btn keep" title="Keep Edit">&#x270E; Keep Edit</button>
        <button id="btn-undo" class="action-btn undo" title="Undo">&#x21A9; Undo</button>
      </div>
    </div>

    <!-- Document Content with Numbered Citations -->
    <div id="doc-content" class="doc-content">
      <div class="doc-block numbered" data-citation="1">
        <span class="citation-badge doc-badge">&#x276A;</span>
        <p id="block-1">Loading document&hellip;</p>
      </div>
      <div class="doc-block numbered" data-citation="2">
        <span class="citation-badge doc-badge">&#x276B;</span>
        <p id="block-2"></p>
      </div>
      <div class="doc-block numbered" data-citation="3">
        <span class="citation-badge doc-badge">&#x276C;</span>
        <p id="block-3"></p>
      </div>
    </div>

    <!-- Split Diff View (hidden by default) -->
    <div id="split-diff-view" class="split-diff hidden">
      <div class="diff-pane original">
        <h3 class="diff-label">Original</h3>
        <pre id="diff-original"></pre>
      </div>
      <div class="diff-divider"><span class="plus-icon">+</span></div>
      <div class="diff-pane proposed">
        <h3 class="diff-label">Proposed Edit</h3>
        <pre id="diff-proposed"></pre>
      </div>
    </div>
  </main>

</div><!-- /app -->
</body>
</html>
